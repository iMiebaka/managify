# Local dev profile. Infra comes from docker-compose.local.yml.
#
# Run:  .\mvnw.cmd spring-boot:run

# Hibernate specific properties
spring.jpa.show-sql=true

# MySQL (local docker: managify-mysql)
spring.datasource.url=jdbc:mysql://localhost:3306/managify_db?createDatabaseIfNotExist=true&useTimezone=true&serverTimezone=Africa/Lagos&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root

# Redis (local docker: managify-redis)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=managify

# Server Port number specific properties
server.port=8080

base-url=http://localhost:8080
