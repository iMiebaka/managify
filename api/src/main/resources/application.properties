#######################################################
#                                                     #
# DO NOT delete the configurations found in this file #
#    override them instead in the target profile      #
#                                                     #
# Secrets come from environment variables only.       #
# Never put a secret value in any properties file.    #
#                                                     #
#######################################################

# Logging specific properties
logging.level.org.springframework.web=info

## Default number of items in a page for paginated db fetches
app.page-size=10

#####################################################
#               DO NOT OVERRIDE THESE               #
#   Just Change Value (If and when necessary)       #
#####################################################
# SET Application Active Profile
# possible values = @activatedProperties@, dev, staging, prod
# @activatedProperties@ uses the active Maven profile in the pom.xml (default: dev).
# The SPRING_PROFILES_ACTIVE env var overrides it.
spring.profiles.active=@activatedProperties@

spring.application.name=managify-api

# Application specific properties
app.api-version=v1
app.title=api/${app.api-version}

# Database properties (URL, username and password are set per profile)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Lagos
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.pool-name=${spring.application.name}-pool

# Flyway owns the schema. baseline-version=0 so V1 still runs if the schema is not empty.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false

# File Upload Configurations
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=100MB

server.error.include-message=always

# REDIS / CACHE (host, port and password are set per profile)
spring.data.redis.database=0
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s
# Time-to-live per cache. Writes evict the affected entries, so these only bound staleness.
app.cache.ttl.project-tracker=30m
app.cache.ttl.project=1h
app.cache.ttl.worker=1h
app.cache.ttl.worker-items=10m
# The API keeps working (straight from MySQL) when Redis is down, so Redis must not mark the service unhealthy.
management.health.redis.enabled=false

# KEYCLOAK CONFIG (JWT resource server)
keycloak.realm=${KEYCLOAK_REALM:managify}
keycloak.url=${KEYCLOAK_URL:http://localhost:8180}
keycloak.issuer-url=${keycloak.url}/realms/${keycloak.realm}

# CORS: comma-separated origin patterns
app.cors.allowed-origin-patterns=http://localhost:*

# Swagger config
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true

# Force OpenAPI 3.0.1 instead of 3.1.0
springdoc.api-docs.version=openapi_3_0

# Actuator health endpoint for Docker health check
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
